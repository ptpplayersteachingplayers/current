<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Confirm your session — PTP</title>
  <meta name="description" content="Pay for a private training session.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Cpath d='M8 24V8h8a5 5 0 0 1 0 10h-4' stroke='%23FCB900' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/shared/styles.css">
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <main id="app">
    <div class="wrap"><div class="loading"><span class="spinner"></span><span>Loading…</span></div></div>
  </main>
  <script type="module">
    import { mountChrome } from "/shared/chrome.js";
    import { start } from "/private-training/pay/app.js";
    mountChrome();
    start(document.querySelector("#app")).catch((error) => {
      document.querySelector("#app").textContent =
        "We could not reach PTP just now. Please try again in a moment.";
      console.error(error);
    });
  </script>
</body>
</html>
