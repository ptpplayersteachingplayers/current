<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <title>Your PTP account</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d0f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23c9a227'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <header class="topbar">
    <span class="wordmark">PTP</span>
    <span>Your account</span>
    <a class="who" href="../book/">Browse groups</a>
  </header>

  <main id="app">
    <div class="loading"><span class="spinner"></span><span>Loading…</span></div>
  </main>

  <script type="module">
    import { boot } from "../shared/boot.js";
    import { start } from "./app.js";

    boot()
      .then((api) => start(document.querySelector("#app"), api))
      .catch((error) => {
        document.querySelector("#app").textContent =
          "We could not reach PTP just now. Please try again in a moment.";
        console.error(error);
      });
  </script>
</body>
</html>
