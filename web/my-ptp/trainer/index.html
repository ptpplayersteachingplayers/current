<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>PTP Trainer</title>
  <meta name="description" content="Your day, your registers and your hours.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230A0A0A'/%3E%3Cpath d='M8 24V8h8a5 5 0 0 1 0 10h-4' stroke='%23FCB900' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
</head>
<body>
  <main id="app" class="wrap">
    <div class="loading"><span class="spinner"></span><span>Loading…</span></div>
  </main>
  <script type="module">
    import { mountChrome } from "/shared/chrome.js";
    import { offlineView } from "/shared/offline.js";
    import { start } from "/my-ptp/trainer/app.js";

    // The chrome first, and separately: a page that cannot load its data
    // should still have a header, a menu and a way out.
    mountChrome({ variant: "trainer" });

    start(document.querySelector("#app")).catch((error) => {
      console.error(error);
      offlineView(document.querySelector("#app"));
    });
  </script>
</body>
</html>
